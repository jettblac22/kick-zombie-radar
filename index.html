<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    /* Fixed Crisp HUD in Corner */
    #hud-container {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 240px;
      background: #0d120d; /* Solid high-contrast backing */
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 255, 102, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px 12px 10px;
      cursor: pointer;
      z-index: 100;
    }

    canvas {
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.7);
      background: radial-gradient(circle, #09210e 0%, #030804 100%);
    }

    .telemetry-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #72a87c;
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      font-family: "Arial Black", Impact, sans-serif;
    }

    /* Fullscreen Screen Danger Overlay */
    #danger-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      box-sizing: border-box;
      border: 0px solid rgba(255, 0, 40, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-width 0.15s ease-in-out;
      z-index: 99;
    }

    .chase-warning {
      display: none;
      font-size: 46px;
      font-weight: 900;
      color: #FF0033;
      text-shadow: 0 0 25px #000, 0 0 35px #FF0033;
      animation: pulse 0.35s infinite alternate;
      letter-spacing: 2px;
      text-align: center;
      font-family: "Arial Black", Impact, sans-serif;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.85; }
      to { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="danger-screen">
    <div id="chase-text" class="chase-warning">⚠ INFECTION CLOSING IN ⚠<br><span style="font-size: 26px; color: #fff;">SPRINT > 14 MPH TO ESCAPE!</span></div>
  </div>

  <div id="hud-container" title="Tap to test">
    <canvas id="radar" width="200" height="200"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const KICK_CHAT_ID = "2211151";
    const KICK_CHAN_ID = "2218653";
    const ESCAPE_SPEED_MPH = 14.0;
    const DANGER_DISTANCE_METERS = 35.0;

    let player = { lat: 0, lon: 0, speedMph: 0, heading: 0 };
    let zombies = [];
    let isUnderAttack = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const dangerScreen = document.getElementById('danger-screen');
    const chaseText = document.getElementById('chase-text');

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAlarmDrone(highPitch = false) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(highPitch ? 340 : 95, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(highPitch ? 150 : 40, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    // Hardware GPS
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          player.lat = pos.coords.latitude;
          player.lon = pos.coords.longitude;
          player.heading = pos.coords.heading || 0;
          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;
          evaluateSurvivalState();
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function spawnZombie(type = "normal") {
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;
      const radiusMeters = 40 + Math.random() * 30;
      const angle = Math.random() * Math.PI * 2;
      const dLat = (radiusMeters * Math.cos(angle)) / 111320;
      const dLon = (radiusMeters * Math.sin(angle)) / (111320 * Math.cos(currentLat * Math.PI / 180));

      zombies.push({
        id: Date.now() + Math.random(),
        lat: currentLat + dLat,
        lon: currentLon + dLon,
        speedFactor: type === "fast" ? 1.5 : 1.0
      });

      countEl.innerText = zombies.length;
      playAlarmDrone(false);
    }

    // Tap to test trigger
    document.getElementById('hud-container').addEventListener('click', () => {
      spawnZombie("fast");
    });

    // --- MULTI-SOCKET KICK CONNECTION ---
    function handleIncoming(data) {
      try {
        const raw = typeof data === 'string' ? data : JSON.stringify(data);
        if (raw.toLowerCase().includes('!zombie')) {
          spawnZombie("fast");
        }
      } catch(e) {}
    }

    function connectPusher(appKey, cluster, host) {
      const client = new Pusher(appKey, {
        cluster: cluster,
        wsHost: host,
        wsPort: 443,
        wssPort: 443,
        forceTLS: true,
        disableStats: true,
        enabledTransports: ['ws', 'wss']
      });

      const ch1 = client.subscribe(`chatrooms.${KICK_CHAT_ID}.v2`);
      const ch2 = client.subscribe(`channel.${KICK_CHAN_ID}`);
      
      [ch1, ch2].forEach(c => {
        c.bind_global((evt, data) => handleIncoming(data));
      });
      return client;
    }

    // Connect to primary cluster and backup cluster simultaneously
    connectPusher('32cbd69e4b950ba42379', 'us2', 'ws-us2.pusher.com');
    connectPusher('eeb10e89e4726244f2b1', 'us2', 'ws-us2.pusher.com');

    // Survival Engine
    function evaluateSurvivalState() {
      let nearestDist = Infinity;
      zombies.forEach((z) => {
        const dist = getDistanceMeters(player.lat, player.lon, z.lat, z.lon);
        if (dist < nearestDist) nearestDist = dist;
        const step = 0.00003; 
        z.lat += (player.lat - z.lat) * step;
        z.lon += (player.lon - z.lon) * step;
      });

      countEl.innerText = zombies.length;

      if (nearestDist < DANGER_DISTANCE_METERS) {
        isUnderAttack = true;
        dangerScreen.style.borderWidth = "28px";
        chaseText.style.display = "block";
        playAlarmDrone(true);

        if (player.speedMph >= ESCAPE_SPEED_MPH) {
          zombies = zombies.filter(z => getDistanceMeters(player.lat, player.lon, z.lat, z.lon) > DANGER_DISTANCE_METERS);
        }
      } else {
        isUnderAttack = false;
        dangerScreen.style.borderWidth = "0px";
        chaseText.style.display = "none";
      }
    }

    // Radar Render
    let scanAngle = 0;
    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radarMaxMeters = 100.0;

      // Range Rings
      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / radarMaxMeters) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      // Scan Sweep
      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      // Center Player Blip
      ctx.fillStyle = "#00E5FF";
      ctx.shadowColor = "#00E5FF";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Zombie Blips
      zombies.forEach(z => {
        const d = getDistanceMeters(player.lat, player.lon, z.lat, z.lon);
        if (d <= radarMaxMeters) {
          const bearing = Math.atan2(z.lon - player.lon, z.lat - player.lat);
          const drawDist = (d / radarMaxMeters) * (cx - 12);
          const x = cx + drawDist * Math.sin(bearing);
          const y = cy - drawDist * Math.cos(bearing);

          ctx.fillStyle = "#FF0033";
          ctx.shadowColor = "#FF0033";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      requestAnimationFrame(drawRadar);
    }

    setInterval(evaluateSurvivalState, 1000);
    drawRadar();
  </script>
</body>
</html>
