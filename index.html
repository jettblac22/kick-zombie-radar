<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      font-family: 'Courier New', monospace;
      color: #00FF66;
      overflow: hidden;
      user-select: none;
    }

    #hud-container {
      position: relative;
      width: 220px;
      height: 260px;
      background: rgba(10, 15, 10, 0.75);
      border: 2px solid #00FF66;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      cursor: pointer;
    }

    canvas {
      border-radius: 50%;
      border: 1px dashed rgba(0, 255, 102, 0.5);
      background: radial-gradient(circle, rgba(0, 40, 10, 0.6) 0%, rgba(0, 10, 0, 0.8) 100%);
    }

    .telemetry-bar {
      margin-top: 8px;
      width: 85%;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Screen Danger Overlay */
    #danger-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      box-sizing: border-box;
      border: 0px solid rgba(255, 0, 40, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-width 0.15s ease-in-out;
    }

    .chase-warning {
      display: none;
      font-size: 42px;
      font-weight: 900;
      color: #FF0033;
      text-shadow: 0 0 20px #000, 0 0 30px #FF0033;
      animation: pulse 0.4s infinite alternate;
      letter-spacing: 3px;
      text-align: center;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Alert Overlay -->
  <div id="danger-screen">
    <div id="chase-text" class="chase-warning">⚠ INFECTION CLOSING IN ⚠<br><span style="font-size: 24px; color: #fff;">SPRINT > 14 MPH TO ESCAPE!</span></div>
  </div>

  <!-- Minimap HUD Widget -->
  <div id="hud-container" title="Tap to test spawn">
    <canvas id="radar" width="180" height="180"></canvas>
    <div class="telemetry-bar">
      <span>SPD: <span id="speed-val">0.0</span> MPH</span>
      <span>HORDE: <span id="zombie-count">0</span></span>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURATION ---
    const KICK_CHATROOM_ID = "2211151";
    const ESCAPE_SPEED_MPH = 14.0;
    const DANGER_DISTANCE_METERS = 35.0;

    let player = { lat: 0, lon: 0, speedMph: 0, heading: 0 };
    let zombies = [];
    let isUnderAttack = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const dangerScreen = document.getElementById('danger-screen');
    const chaseText = document.getElementById('chase-text');

    // --- 2. AUDIO SYNTHESIZER ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAlarmDrone(highPitch = false) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(highPitch ? 320 : 90, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(highPitch ? 140 : 40, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // --- 3. HARDWARE GPS & TELEMETRY ---
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          player.lat = pos.coords.latitude;
          player.lon = pos.coords.longitude;
          player.heading = pos.coords.heading || 0;

          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;

          evaluateSurvivalState();
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // --- 4. DISTANCE & SPAWN ENGINE ---
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function spawnZombie(type = "normal") {
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;
      
      const radiusMeters = 40 + Math.random() * 30;
      const angle = Math.random() * Math.PI * 2;
      const dLat = (radiusMeters * Math.cos(angle)) / 111320;
      const dLon = (radiusMeters * Math.sin(angle)) / (111320 * Math.cos(currentLat * Math.PI / 180));

      zombies.push({
        id: Date.now() + Math.random(),
        lat: currentLat + dLat,
        lon: currentLon + dLon,
        speedFactor: type === "fast" ? 1.5 : 1.0
      });

      countEl.innerText = zombies.length;
      playAlarmDrone(false);
    }

// --- 5. MULTI-TARGET KICK INTEGRATION ---
    const KICK_CHAT_ID = "2211151";
    const KICK_CHAN_ID = "2218653";

    // Primary Pusher Client
    const pusher = new Pusher('32cbd69e4b950ba42379', {
      cluster: 'us2',
      wsHost: 'ws-us2.pusher.com',
      wsPort: 443,
      wssPort: 443,
      forceTLS: true,
      enabledTransports: ['ws', 'wss']
    });

    pusher.connection.bind('connected', () => {
      countEl.style.color = '#00FF66';
      countEl.style.textShadow = '0 0 8px #00FF66';
    });

    function inspectPayload(data) {
      try {
        const str = typeof data === 'string' ? data : JSON.stringify(data);
        if (str.toLowerCase().includes('!zombie')) {
          spawnZombie("fast");
        }
      } catch (e) {}
    }

    // Subscribe to both Chatroom ID and Channel ID channels
    const channels = [
      pusher.subscribe(`chatrooms.${KICK_CHAT_ID}.v2`),
      pusher.subscribe(`chatroom_${KICK_CHAT_ID}`),
      pusher.subscribe(`channel.${KICK_CHAN_ID}`),
      pusher.subscribe(`chatrooms.${KICK_CHAN_ID}.v2`)
    ];

    channels.forEach(ch => {
      ch.bind_global((evt, data) => {
        if (!evt.startsWith('pusher:')) {
          inspectPayload(data);
        }
      });
      ch.bind('App\\Events\\ChatMessageEvent', inspectPayload);
      ch.bind('ChatMessageEvent', inspectPayload);
    });

    
    // --- 6. TAP-TO-TEST TRIGGER ---
    document.getElementById('hud-container').addEventListener('click', () => {
      spawnZombie("fast");
    });

    // --- 7. GAME LOOP & ESCAPE MECHANICS ---
    function evaluateSurvivalState() {
      let nearestDist = Infinity;

      zombies.forEach((z) => {
        const dist = getDistanceMeters(player.lat, player.lon, z.lat, z.lon);
        if (dist < nearestDist) nearestDist = dist;

        const step = 0.00003; 
        z.lat += (player.lat - z.lat) * step;
        z.lon += (player.lon - z.lon) * step;
      });

      countEl.innerText = zombies.length;

      if (nearestDist < DANGER_DISTANCE_METERS) {
        isUnderAttack = true;
        dangerScreen.style.borderWidth = "25px";
        chaseText.style.display = "block";
        playAlarmDrone(true);

        if (player.speedMph >= ESCAPE_SPEED_MPH) {
          zombies = zombies.filter(z => getDistanceMeters(player.lat, player.lon, z.lat, z.lon) > DANGER_DISTANCE_METERS);
        }
      } else {
        isUnderAttack = false;
        dangerScreen.style.borderWidth = "0px";
        chaseText.style.display = "none";
      }
    }

    // --- 8. RADAR RENDERING ---
    let scanAngle = 0;
    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radarMaxMeters = 100.0;

      ctx.strokeStyle = "rgba(0, 255, 102, 0.25)";
      ctx.lineWidth = 1;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / radarMaxMeters) * (cx - 5), 0, Math.PI * 2);
        ctx.stroke();
      });

      scanAngle += 0.04;
      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 5), cy + Math.sin(scanAngle) * (cy - 5));
      ctx.stroke();

      ctx.fillStyle = "#00E5FF";
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();

      zombies.forEach(z => {
        const d = getDistanceMeters(player.lat, player.lon, z.lat, z.lon);
        if (d <= radarMaxMeters) {
          const bearing = Math.atan2(z.lon - player.lon, z.lat - player.lat);
          const drawDist = (d / radarMaxMeters) * (cx - 10);
          const x = cx + drawDist * Math.sin(bearing);
          const y = cy - drawDist * Math.cos(bearing);

          ctx.fillStyle = "#FF0033";
          ctx.shadowColor = "#FF0033";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      requestAnimationFrame(drawRadar);
    }

    setInterval(evaluateSurvivalState, 1000);
    drawRadar();
  </script>
</body>
</html>
