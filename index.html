<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    /* Fixed Crisp Cockpit HUD */
    #hud-container {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 240px;
      background: #0d120d;
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 255, 102, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 12px 10px;
      cursor: pointer;
      z-index: 100;
    }

    /* Red Bold Title */
    .hud-title {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FF0033;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.7), 0 0 20px rgba(0, 0, 0, 0.9);
    }

    canvas {
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.7);
      background: radial-gradient(circle, #09210e 0%, #030804 100%);
    }

    .telemetry-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #72a87c;
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      font-family: "Arial Black", Impact, sans-serif;
    }

    /* Screen Danger & Infection Overlays */
    #danger-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      box-sizing: border-box;
      border: 0px solid rgba(255, 0, 40, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-width 0.15s ease-in-out;
      z-index: 99;
    }

    .chase-warning {
      display: none;
      font-size: 46px;
      font-weight: 900;
      color: #FF0033;
      text-shadow: 0 0 25px #000, 0 0 35px #FF0033;
      animation: pulse 0.35s infinite alternate;
      letter-spacing: 2px;
      text-align: center;
      font-family: "Arial Black", Impact, sans-serif;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.85; }
      to { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="danger-screen">
    <div id="chase-text" class="chase-warning">⚠ HORDE OUTBREAK ⚠<br><span id="sub-warning" style="font-size: 26px; color: #fff;">SPRINT > 14 MPH TO ESCAPE!</span></div>
  </div>

  <div id="hud-container" title="Tap to test spawn">
    <div class="hud-title">ZOMBIE ESCAPE</div>
    <canvas id="radar" width="200" height="200"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const ESCAPE_SPEED_MPH = 14.0;
    const DANGER_DISTANCE_METERS = 35.0;
    const HORDE_TRIGGER_COUNT = 10;

    let player = { lat: 0, lon: 0, speedMph: 0, heading: 0 };
    let zombies = [];
    let isUnderAttack = false;
    let alertStartTime = null;
    let isOverrun = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const dangerScreen = document.getElementById('danger-screen');
    const chaseText = document.getElementById('chase-text');
    const subWarning = document.getElementById('sub-warning');

    // --- AUDIO & MUSIC ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicOscs = [];
    let musicGain = null;
    let musicInterval = null;

    // Cinematic Horror "DUNNN!" Stinger
    function playHorrorDunn() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;

      // Low brass sub impact
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(65, t);
      osc1.frequency.exponentialRampToValueAtTime(32, t + 1.2);

      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(68.5, t); // Metallic dissonance beating
      osc2.frequency.exponentialRampToValueAtTime(31, t + 1.2);

      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 1.2);
      osc2.stop(t + 1.2);
    }

    // Procedural Haunting Chase Score
    function startHauntingMusic() {
      if (musicGain) return; // Already running
      if (audioCtx.state === 'suspended') audioCtx.resume();

      musicGain = audioCtx.createGain();
      musicGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      musicGain.connect(audioCtx.destination);

      // Deep oscillating drone
      const bass1 = audioCtx.createOscillator();
      const bass2 = audioCtx.createOscillator();
      bass1.type = 'sawtooth';
      bass2.type = 'sine';
      bass1.frequency.setValueAtTime(43.65, audioCtx.currentTime); // F1
      bass2.frequency.setValueAtTime(46.25, audioCtx.currentTime); // F#1 (Tritone edge)

      bass1.connect(musicGain);
      bass2.connect(musicGain);
      bass1.start();
      bass2.start();
      musicOscs = [bass1, bass2];

      // Creepy staccato rhythm pulse
      musicInterval = setInterval(() => {
        if (!musicGain) return;
        const pulseOsc = audioCtx.createOscillator();
        const pulseGain = audioCtx.createGain();
        pulseOsc.type = 'sawtooth';
        pulseOsc.frequency.setValueAtTime(87.31 + Math.random() * 5, audioCtx.currentTime);
        pulseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        pulseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        pulseOsc.connect(pulseGain);
        pulseGain.connect(audioCtx.destination);
        pulseOsc.start();
        pulseOsc.stop(audioCtx.currentTime + 0.18);
      }, 420);
    }

    function intensifyMusic() {
      if (musicGain) {
        musicGain.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 1.0);
      }
    }

    function stopHauntingMusic() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
      if (musicGain) {
        musicGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        setTimeout(() => {
          musicOscs.forEach(o => { try { o.stop(); } catch(e){} });
          musicOscs = [];
          musicGain = null;
        }, 400);
      }
    }

    // Rasping Evil Voice Engine
    function speakEvilVoice(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.pitch = 0.2;  // Demonic pitch
      utter.rate = 0.75;  // Slow, menacing crawl
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    }

    // --- HARDWARE GPS & TELEMETRY ---
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          player.lat = pos.coords.latitude;
          player.lon = pos.coords.longitude;
          player.heading = pos.coords.heading || 0;
          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;
          evaluateSurvivalState();
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function createSingleZombie() {
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;
      const radiusMeters = 55 + Math.random() * 35;
      const angle = Math.random() * Math.PI * 2;
      const dLat = (radiusMeters * Math.cos(angle)) / 111320;
      const dLon = (radiusMeters * Math.sin(angle)) / (111320 * Math.cos(currentLat * Math.PI / 180));

      zombies.push({
        id: Date.now() + Math.random(),
        lat: currentLat + dLat,
        lon: currentLon + dLon
      });
    }

    function triggerZombieSpawnEvent() {
      const isPack = Math.random() < 0.10;
      const spawnCount = isPack ? 3 : 1;

      for (let i = 0; i < spawnCount; i++) {
        createSingleZombie();
      }

      countEl.innerText = zombies.length;
      playHorrorDunn();
    }

    // Continuous random timer (30s to 120s)
    function scheduleNextSpawn() {
      const nextDelayMs = (30 + Math.random() * 90) * 1000;
      setTimeout(() => {
        triggerZombieSpawnEvent();
        scheduleNextSpawn();
      }, nextDelayMs);
    }
    scheduleNextSpawn();

    // Tap HUD box to manual test
    document.getElementById('hud-container').addEventListener('click', () => {
      triggerZombieSpawnEvent();
    });

    // --- SURVIVAL LOOP & ESCAPE / OVERRUN LOGIC ---
    function evaluateSurvivalState() {
      let nearestDist = Infinity;
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;

      zombies.forEach((z) => {
        const dist = getDistanceMeters(currentLat, currentLon, z.lat, z.lon);
        if (dist < nearestDist) nearestDist = dist;

        const step = 0.000035;
        z.lat += (currentLat - z.lat) * step;
        z.lon += (currentLon - z.lon) * step;
      });

      countEl.innerText = zombies.length;

      const isHordeActive = zombies.length >= HORDE_TRIGGER_COUNT;
      const isTooClose = nearestDist < DANGER_DISTANCE_METERS;

      if (isTooClose || isHordeActive) {
        if (!isUnderAttack) {
          isUnderAttack = true;
          alertStartTime = Date.now();
          dangerScreen.style.borderWidth = "28px";
          chaseText.style.display = "block";
          startHauntingMusic();
        }

        // Check if 20 seconds elapsed without hitting 14 MPH
        const elapsed = (Date.now() - alertStartTime) / 1000;
        if (elapsed >= 20 && !isOverrun) {
          isOverrun = true;
          intensifyMusic();
          subWarning.innerText = "OVERRUN! INFECTION SYSTEM CRITICAL!";
          subWarning.style.color = "#FF0033";
        }

        // Player hits 14 MPH escape threshold
        if (player.speedMph >= ESCAPE_SPEED_MPH) {
          if (isOverrun) {
            // Player failed the 20s window: Evil voice trigger
            speakEvilVoice("It's too late... you are a zombie now!");
            subWarning.innerText = "YOU ARE A ZOMBIE NOW!";
            setTimeout(() => {
              // Reset game state after infection
              zombies = [];
              isOverrun = false;
              isUnderAttack = false;
              alertStartTime = null;
              subWarning.innerText = "SPRINT > 14 MPH TO ESCAPE!";
              subWarning.style.color = "#fff";
              dangerScreen.style.borderWidth = "0px";
              chaseText.style.display = "none";
              stopHauntingMusic();
            }, 5000);
          } else {
            // Clean Escape within the 20s window
            zombies = [];
            isUnderAttack = false;
            alertStartTime = null;
            dangerScreen.style.borderWidth = "0px";
            chaseText.style.display = "none";
            stopHauntingMusic();
          }
        }
      } else {
        if (!isOverrun) {
          isUnderAttack = false;
          alertStartTime = null;
          dangerScreen.style.borderWidth = "0px";
          chaseText.style.display = "none";
          stopHauntingMusic();
        }
      }
    }

    // --- RADAR RENDERING ---
    let scanAngle = 0;
    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radarMaxMeters = 100.0;
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;

      // Radar Range Rings
      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / radarMaxMeters) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      // Scan Sweep
      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      // Center Player Blip
      ctx.fillStyle = "#00E5FF";
      ctx.shadowColor = "#00E5FF";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Approaching Red Zombie Blips
      zombies.forEach(z => {
        const d = getDistanceMeters(currentLat, currentLon, z.lat, z.lon);
        if (d <= radarMaxMeters) {
          const bearing = Math.atan2(z.lon - currentLon, z.lat - currentLat);
          const drawDist = (d / radarMaxMeters) * (cx - 12);
          const x = cx + drawDist * Math.sin(bearing);
          const y = cy - drawDist * Math.cos(bearing);

          ctx.fillStyle = "#FF0033";
          ctx.shadowColor = "#FF0033";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      requestAnimationFrame(drawRadar);
    }

    setInterval(evaluateSurvivalState, 1000);
    drawRadar();
  </script>
</body>
</html>
