<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    /* Pinned Bottom-Right Corner */
    #hud-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 240px;
      background: #0d120d;
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 255, 102, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 12px 10px;
      z-index: 100;
    }

    .hud-title {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FF0033;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.7), 0 0 20px rgba(0, 0, 0, 0.9);
    }

    canvas {
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.7);
      background: radial-gradient(circle, #09210e 0%, #030804 100%);
    }

    .telemetry-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #72a87c;
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      font-family: "Arial Black", Impact, sans-serif;
    }

    #stream-alert-box {
      display: none;
      position: absolute;
      bottom: 330px;
      right: 24px;
      width: 300px;
      background: rgba(180, 0, 20, 0.95);
      border: 3px solid #FF0033;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.8), 0 0 15px #000;
      animation: pulse 0.4s infinite alternate;
      z-index: 101;
    }

    .alert-main {
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 0 0 10px #000;
      letter-spacing: 1.5px;
      font-family: "Arial Black", Impact, sans-serif;
    }

    .alert-timer {
      font-size: 28px;
      font-weight: 900;
      color: #FFF;
      font-family: "Arial Black", Impact, sans-serif;
      margin: 4px 0;
    }

    .alert-sub {
      font-size: 14px;
      font-weight: 800;
      color: #FFE600;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <div id="stream-alert-box">
    <div class="alert-main" id="alert-title">⚠ HORDE OUTBREAK ⚠</div>
    <div class="alert-timer" id="alert-timer">00:45</div>
    <div class="alert-sub" id="alert-desc">SPRINT > 15 MPH TO ESCAPE!</div>
  </div>

  <div id="hud-container">
    <div class="hud-title">ZOMBIE ESCAPE</div>
    <canvas id="radar" width="200" height="200"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const HORDE_TRIGGER_COUNT = 10;
    const HORDE_ESCAPE_MPH = 15.0;
    const HORDE_TIME_LIMIT_SEC = 45;
    const SPRINTER_ESCAPE_MPH = 17.0;
    const RESTART_TRIGGER_MPH = 14.0;
    const RADAR_MAX_METERS = 100.0;

    let player = { lat: 42.3314, lon: -83.0458, speedMph: 0, headingRad: 0, targetHeading: 0 };
    let zombies = [];
    let isHordeActive = false;
    let isSprinterActive = false;
    let hordeDeadline = null;
    let sprinterDeadline = null;
    let isZombieState = false;
    let isDustingZombies = false; // Escape visual trigger

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const alertBox = document.getElementById('stream-alert-box');
    const alertTitle = document.getElementById('alert-title');
    const alertTimer = document.getElementById('alert-timer');
    const alertDesc = document.getElementById('alert-desc');

    // --- SILENT PRELOAD AUDIO PIPELINE ---
    function createTrack(filename, loop = false) {
      const a = new Audio(filename);
      a.preload = 'auto';
      a.loop = loop;
      a.playsInline = true;
      return a;
    }

    const sfxDunn = createTrack('dunn.m4a');
    const musicChase = createTrack('chase.m4a', true);
    const voiceEvil = createTrack('evil_voice.m4a');

    // Primed muted to prevent initial overlapping audio blast
    [sfxDunn, musicChase, voiceEvil].forEach(track => {
      track.muted = true;
      const p = track.play();
      if (p !== undefined) {
        p.then(() => {
          track.pause();
          track.currentTime = 0;
          track.muted = false;
        }).catch(() => {
          track.muted = false;
        });
      }
    });

    function playSound(track) {
      track.currentTime = 0;
      const p = track.play();
      if (p !== undefined) {
        p.catch(e => console.warn('Audio auto-play prevented:', e));
      }
    }

    // --- HARDWARE GPS TELEMETRY ---
    let lastGpsLat = null;
    let lastGpsLon = null;

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const newLat = pos.coords.latitude;
          const newLon = pos.coords.longitude;

          if (lastGpsLat !== null && lastGpsLon !== null) {
            const dY = newLat - lastGpsLat;
            const dX = (newLon - lastGpsLon) * Math.cos(newLat * Math.PI / 180);
            if (Math.hypot(dY, dX) > 0.00001) {
              player.targetHeading = Math.atan2(dX, dY);
            }
          }
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            player.targetHeading = pos.coords.heading * Math.PI / 180;
          }

          lastGpsLat = newLat;
          lastGpsLon = newLon;
          player.lat = newLat;
          player.lon = newLon;

          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // --- SPAWNING SYSTEM WITH SPREAD-OUT DISTANCES ---
    function spawnZombie(forceSprinter = false) {
      if (isZombieState) return;

      const isSprinter = forceSprinter || (Math.random() < 0.03);
      const isAmbush = isSprinter ? false : (Math.random() < 0.20);
      
      // Keep rear pack well spread out in an arc behind you
      const relAngle = isAmbush 
        ? (Math.random() - 0.5) * (Math.PI / 2) 
        : Math.PI + (Math.random() - 0.5) * 1.8;

      // Unique holding distance for each zombie so they don't bunch into a clump
      const personalHoldDist = 38 + Math.random() * 26; // Follows 38m - 64m back

      zombies.push({
        id: Date.now() + Math.random(),
        dist: 85 + Math.random() * 15,
        targetHoldDist: personalHoldDist,
        relAngle: relAngle,
        mode: isAmbush ? 'charge' : 'chase',
        type: isSprinter ? 'sprinter' : 'normal'
      });

      countEl.innerText = zombies.length;
      playSound(sfxDunn);

      if (isSprinter && !isSprinterActive) {
        triggerSprinter();
      }
    }

    function triggerHordeSpawn() {
      const isPack = Math.random() < 0.10;
      const count = isPack ? 3 : 1;
      for (let i = 0; i < count; i++) {
        spawnZombie();
      }
    }

    function scheduleSpawn() {
      setTimeout(() => {
        triggerHordeSpawn();
        scheduleSpawn();
      }, (15 + Math.random() * 35) * 1000);
    }
    scheduleSpawn();

    function triggerSprinter() {
      isSprinterActive = true;
      sprinterDeadline = Date.now() + (20 * 1000);

      musicChase.currentTime = 0;
      musicChase.play().catch(() => {});

      alertBox.style.display = "block";
      alertBox.style.background = "rgba(0, 40, 180, 0.95)";
      alertBox.style.borderColor = "#00D9FF";
      alertBox.style.boxShadow = "0 0 30px rgba(0, 217, 255, 0.8), 0 0 15px #000";
      alertTitle.innerText = "⚡ BLUE SPRINTER DETECTED ⚡";
      alertDesc.innerText = "SPRINT > 17 MPH TO ESCAPE!";
      alertDesc.style.color = "#00E5FF";
    }

    // --- GAME ENGINE & DYNAMIC DISTANCE LOOP ---
    let lastTime = performance.now();
    let scanAngle = 0;

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Heading smoothing
      let diff = player.targetHeading - player.headingRad;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      player.headingRad += diff * 0.05;

      // Distance & Swarm Mechanics
      zombies.forEach((z) => {
        if (isDustingZombies) {
          // ESCAPED: Rapidly drop behind and disappear off radar edge
          z.dist += (35 + Math.random() * 20) * dt;
          return;
        }

        if (isSprinterActive) {
          // Sprinter actively sprints to zero distance over the 20-second clock
          const progress = Math.max(0, (sprinterDeadline - Date.now()) / (20 * 1000));
          const targetDist = z.type === 'sprinter' ? (progress * 55) : (progress * z.targetHoldDist);
          z.dist += (targetDist - z.dist) * (0.08);
        } else if (isHordeActive) {
          // Horde actively closes in from 45s down to 0s
          const progress = Math.max(0, (hordeDeadline - Date.now()) / (HORDE_TIME_LIMIT_SEC * 1000));
          const targetDist = progress * (z.targetHoldDist + 5);
          z.dist += (targetDist - z.dist) * (0.06);
        } else {
          // PRE-HORDE: Maintain comfortable holding gap behind player
          if (z.mode === 'charge') {
            z.dist -= 18 * dt;
            if (z.dist <= z.targetHoldDist) {
              z.mode = 'chase';
              z.relAngle = Math.PI + (Math.random() - 0.5) * 1.2;
            }
          } else {
            // Smoothly ease to trailing distance
            z.dist += (z.targetHoldDist - z.dist) * (0.04);
            if (z.dist < 28) z.dist = 28; // Strict minimum gap before horde starts
          }
        }
      });

      handleGameState();
      renderRadar();
      requestAnimationFrame(gameLoop);
    }

    function handleGameState() {
      // 1. INFECTED: Mechanical restart throttle (Speed > 14 MPH)
      if (isZombieState) {
        if (player.speedMph >= RESTART_TRIGGER_MPH) {
          resetBoard();
        }
        return;
      }

      // 2. BLUE SPRINTER ESCAPE CHECK
      if (isSprinterActive) {
        const remainingMs = sprinterDeadline - Date.now();
        const remSec = Math.max(0, Math.ceil(remainingMs / 1000));
        alertTimer.innerText = "00:" + (remSec < 10 ? "0" : "") + remSec;

        if (player.speedMph >= SPRINTER_ESCAPE_MPH && !isDustingZombies) {
          triggerEscapeSequence("⚡ SPRINTER EVADED ⚡", "BOARD CLEARED!");
          return;
        }

        if (remSec <= 0 && !isDustingZombies) {
          triggerInfectionFail();
        }
        return;
      }

      // 3. HORDE ESCAPE CHECK (10+ Zombies)
      if (zombies.length >= HORDE_TRIGGER_COUNT && !isHordeActive && !isDustingZombies) {
        isHordeActive = true;
        hordeDeadline = Date.now() + (HORDE_TIME_LIMIT_SEC * 1000);

        alertBox.style.display = "block";
        alertBox.style.background = "rgba(180, 0, 20, 0.95)";
        alertBox.style.borderColor = "#FF0033";
        alertBox.style.boxShadow = "0 0 30px rgba(255, 0, 51, 0.8), 0 0 15px #000";
        alertTitle.innerText = "⚠ HORDE OUTBREAK ⚠";
        alertDesc.innerText = "SPRINT > 15 MPH TO ESCAPE!";
        alertDesc.style.color = "#FFE600";

        musicChase.currentTime = 0;
        musicChase.play().catch(() => {});
      }

      if (isHordeActive) {
        const remainingMs = hordeDeadline - Date.now();
        const totalSec = Math.max(0, Math.ceil(remainingMs / 1000));
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        alertTimer.innerText = (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;

        // Met escape speed: fling zombies backward off the screen
        if (player.speedMph >= HORDE_ESCAPE_MPH && !isDustingZombies) {
          triggerEscapeSequence("✓ ESCAPED", "LEFT IN THE DUST!");
          return;
        }

        // Timer hit zero: horde overruns the center
        if (totalSec <= 0 && !isDustingZombies) {
          triggerInfectionFail();
        }
      }
    }

    function triggerEscapeSequence(titleText, descText) {
      isDustingZombies = true;
      musicChase.pause();
      musicChase.currentTime = 0;

      alertTitle.innerText = titleText;
      alertDesc.innerText = descText;
      alertTimer.innerText = "CLEARED";

      // 1.8 seconds of visual acceleration away before wiping the array
      setTimeout(() => {
        resetBoard();
      }, 1800);
    }

    function triggerInfectionFail() {
      isZombieState = true;
      isHordeActive = false;
      isSprinterActive = false;
      isDustingZombies = false;

      musicChase.pause();
      musicChase.currentTime = 0;
      playSound(voiceEvil);

      alertBox.style.display = "block";
      alertBox.style.background = "rgba(70, 0, 0, 0.98)";
      alertBox.style.borderColor = "#FF0000";
      alertTitle.innerText = "☠ YOU ARE A ZOMBIE NOW ☠";
      alertTimer.innerText = "INFECTED";
      alertDesc.innerText = "SPRINT > 14 MPH TO RESTART";
      alertDesc.style.color = "#FF3333";
    }

    function resetBoard() {
      zombies = [];
      countEl.innerText = "0";
      isHordeActive = false;
      isSprinterActive = false;
      isZombieState = false;
      isDustingZombies = false;
      hordeDeadline = null;
      sprinterDeadline = null;
      alertBox.style.display = "none";
      musicChase.pause();
      musicChase.currentTime = 0;
    }

    // --- RADAR RENDER ---
    function renderRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Range rings
      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / RADAR_MAX_METERS) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      // Directional arrow (Top is forward)
      ctx.strokeStyle = "rgba(0, 255, 102, 0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, 8);
      ctx.lineTo(cx, 16);
      ctx.stroke();

      // Sweeper
      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      // Player Indicator (Cyan if alive, Crimson if infected)
      ctx.fillStyle = isZombieState ? "#FF0033" : "#00E5FF";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Zombie Blips
      zombies.forEach(z => {
        if (z.dist <= RADAR_MAX_METERS) {
          const drawDist = (z.dist / RADAR_MAX_METERS) * (cx - 12);
          const x = cx + drawDist * Math.sin(z.relAngle);
          const y = cy - drawDist * Math.cos(z.relAngle);

          ctx.beginPath();
          if (z.type === 'sprinter') {
            ctx.fillStyle = "#00F0FF";
            ctx.shadowColor = "#00F0FF";
            ctx.shadowBlur = 14;
            ctx.arc(x, y, 7.5, 0, Math.PI * 2);
          } else {
            ctx.fillStyle = "#FF0033";
            ctx.shadowColor = "#FF0033";
            ctx.shadowBlur = 10;
            ctx.arc(x, y, 6, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
