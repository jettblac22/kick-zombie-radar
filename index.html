<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    /* Fixed Crisp Cockpit HUD */
    #hud-container {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 240px;
      background: #0d120d;
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 255, 102, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 12px 10px;
      cursor: pointer;
      z-index: 100;
    }

    /* Red Bold Title */
    .hud-title {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FF0033;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.7), 0 0 20px rgba(0, 0, 0, 0.9);
    }

    canvas {
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.7);
      background: radial-gradient(circle, #09210e 0%, #030804 100%);
    }

    .telemetry-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #72a87c;
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      font-family: "Arial Black", Impact, sans-serif;
    }

    /* Screen Danger & Infection Overlays */
    #danger-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      box-sizing: border-box;
      border: 0px solid rgba(255, 0, 40, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-width 0.15s ease-in-out;
      z-index: 99;
    }

    .chase-warning {
      display: none;
      font-size: 46px;
      font-weight: 900;
      color: #FF0033;
      text-shadow: 0 0 25px #000, 0 0 35px #FF0033;
      animation: pulse 0.35s infinite alternate;
      letter-spacing: 2px;
      text-align: center;
      font-family: "Arial Black", Impact, sans-serif;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.85; }
      to { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="danger-screen">
    <div id="chase-text" class="chase-warning">⚠ HORDE OUTBREAK ⚠<br><span id="sub-warning" style="font-size: 26px; color: #fff;">SPRINT > 14 MPH TO ESCAPE!</span></div>
  </div>

  <div id="hud-container" title="Single Tap: Spawn | Double Tap: Simulate 15 MPH Escape">
    <div class="hud-title">ZOMBIE ESCAPE</div>
    <canvas id="radar" width="200" height="200"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const ESCAPE_SPEED_MPH = 14.0;
    const DANGER_DISTANCE_METERS = 35.0;
    const HORDE_TRIGGER_COUNT = 10;

    let player = { lat: 0, lon: 0, speedMph: 0, heading: 0 };
    let zombies = [];
    let isUnderAttack = false;
    let alertStartTime = null;
    let isOverrun = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const dangerScreen = document.getElementById('danger-screen');
    const chaseText = document.getElementById('chase-text');
    const subWarning = document.getElementById('sub-warning');

    // --- REAL AUDIO FILES & IOS UNLOCK ENGINE (.m4a) ---
    function createTrack(filename, loop = false) {
      const a = new Audio(filename);
      a.preload = 'auto';
      a.loop = loop;
      a.playsInline = true;
      return a;
    }

    const sfxDunn = createTrack('dunn.m4a');
    const musicChase = createTrack('chase.m4a', true);
    const voiceEvil = createTrack('evil_voice.m4a');

    let audioUnlocked = false;

    function unlockAudioChannels() {
      if (audioUnlocked) return;
      [sfxDunn, musicChase, voiceEvil].forEach(track => {
        const p = track.play();
        if (p !== undefined) {
          p.then(() => {
            track.pause();
            track.currentTime = 0;
          }).catch(() => {});
        }
      });
      audioUnlocked = true;
    }

    function playSound(audio) {
      audio.currentTime = 0;
      const promise = audio.play();
      if (promise !== undefined) {
        promise.catch(err => console.warn('Playback blocked:', err));
      }
    }

    // --- HARDWARE GPS TELEMETRY ---
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          player.lat = pos.coords.latitude;
          player.lon = pos.coords.longitude;
          player.heading = pos.coords.heading || 0;
          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;
          evaluateSurvivalState();
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function createSingleZombie() {
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;
      const radiusMeters = 55 + Math.random() * 35;
      const angle = Math.random() * Math.PI * 2;
      const dLat = (radiusMeters * Math.cos(angle)) / 111320;
      const dLon = (radiusMeters * Math.sin(angle)) / (111320 * Math.cos(currentLat * Math.PI / 180));

      zombies.push({
        id: Date.now() + Math.random(),
        lat: currentLat + dLat,
        lon: currentLon + dLon
      });
    }

    function triggerZombieSpawnEvent() {
      const isPack = Math.random() < 0.10;
      const spawnCount = isPack ? 3 : 1;

      for (let i = 0; i < spawnCount; i++) {
        createSingleZombie();
      }

      countEl.innerText = zombies.length;
      playSound(sfxDunn);
    }

    // Random spawn loop: every 30s to 120s
    function scheduleNextSpawn() {
      const nextDelayMs = (30 + Math.random() * 90) * 1000;
      setTimeout(() => {
        triggerZombieSpawnEvent();
        scheduleNextSpawn();
      }, nextDelayMs);
    }
    scheduleNextSpawn();

    // Tap radar HUD:
    // Single Tap = Spawn a zombie & play dunn sound
    // Double Tap = Simulate sprinting 15.5 MPH to test escape
    let lastTap = 0;
    document.getElementById('hud-container').addEventListener('click', () => {
      unlockAudioChannels();

      const now = Date.now();
      if (now - lastTap < 350) {
        player.speedMph = 15.5;
        speedEl.innerText = "15.5";
        evaluateSurvivalState();
        setTimeout(() => {
          player.speedMph = 0.0;
          speedEl.innerText = "0.0";
        }, 1500);
      } else {
        triggerZombieSpawnEvent();
      }
      lastTap = now;
    });

    // --- SURVIVAL ENGINE & ESCAPE LOGIC ---
    function evaluateSurvivalState() {
      let nearestDist = Infinity;
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;

      zombies.forEach((z) => {
        const dist = getDistanceMeters(currentLat, currentLon, z.lat, z.lon);
        if (dist < nearestDist) nearestDist = dist;

        const step = 0.000035;
        z.lat += (currentLat - z.lat) * step;
        z.lon += (currentLon - z.lon) * step;
      });

      countEl.innerText = zombies.length;

      const isHordeActive = zombies.length >= HORDE_TRIGGER_COUNT;
      const isTooClose = nearestDist < DANGER_DISTANCE_METERS;

      if (isTooClose || isHordeActive) {
        if (!isUnderAttack) {
          isUnderAttack = true;
          alertStartTime = Date.now();
          dangerScreen.style.borderWidth = "28px";
          chaseText.style.display = "block";
          musicChase.currentTime = 0;
          musicChase.play().catch(() => {});
        }

        const elapsed = (Date.now() - alertStartTime) / 1000;
        if (elapsed >= 20 && !isOverrun) {
          isOverrun = true;
          subWarning.innerText = "OVERRUN! INFECTION CRITICAL!";
          subWarning.style.color = "#FF0033";
        }

        if (player.speedMph >= ESCAPE_SPEED_MPH) {
          if (isOverrun) {
            playSound(voiceEvil);
            subWarning.innerText = "YOU ARE A ZOMBIE NOW!";
            setTimeout(() => {
              zombies = [];
              isOverrun = false;
              isUnderAttack = false;
              alertStartTime = null;
              subWarning.innerText = "SPRINT > 14 MPH TO ESCAPE!";
              subWarning.style.color = "#fff";
              dangerScreen.style.borderWidth = "0px";
              chaseText.style.display = "none";
              musicChase.pause();
            }, 5000);
          } else {
            zombies = [];
            isUnderAttack = false;
            alertStartTime = null;
            dangerScreen.style.borderWidth = "0px";
            chaseText.style.display = "none";
            musicChase.pause();
          }
        }
      } else {
        if (!isOverrun) {
          isUnderAttack = false;
          alertStartTime = null;
          dangerScreen.style.borderWidth = "0px";
          chaseText.style.display = "none";
          musicChase.pause();
        }
      }
    }

    // --- RADAR RENDERING ---
    let scanAngle = 0;
    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radarMaxMeters = 100.0;
      const currentLat = player.lat || 42.3314;
      const currentLon = player.lon || -83.0458;

      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / radarMaxMeters) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      ctx.fillStyle = "#00E5FF";
      ctx.shadowColor = "#00E5FF";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      zombies.forEach(z => {
        const d = getDistanceMeters(currentLat, currentLon, z.lat, z.lon);
        if (d <= radarMaxMeters) {
          const bearing = Math.atan2(z.lon - currentLon, z.lat - currentLat);
          const drawDist = (d / radarMaxMeters) * (cx - 12);
          const x = cx + drawDist * Math.sin(bearing);
          const y = cy - drawDist * Math.cos(bearing);

          ctx.fillStyle = "#FF0033";
          ctx.shadowColor = "#FF0033";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      requestAnimationFrame(drawRadar);
    }

    setInterval(evaluateSurvivalState, 1000);
    drawRadar();
  </script>
</body>
</html>
