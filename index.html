<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zombie Survival Radar</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    /* FULLSCREEN CINEMATIC OVERLAYS */
    #video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 90;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Zombie Running Approach Video */
    #zombie-run-vid {
      display: none;
      max-height: 85vh;
      object-fit: contain;
      transform-origin: center center;
    }

    .zombie-charge-anim {
      display: block !important;
      animation: chargeForward 2.8s ease-in forwards;
    }

    @keyframes chargeForward {
      0% {
        transform: scale(0.32);
        opacity: 0.2;
      }
      35% {
        opacity: 0.95;
      }
      90% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    /* Zombie Bite Jumpscare Video */
    #zombie-bite-vid {
      display: none;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    /* Radar HUD - Bottom Right */
    #hud-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 220px;
      background: rgba(10, 15, 10, 0.96);
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 1), 0 0 14px rgba(0, 255, 102, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
      z-index: 100;
    }

    .hud-title {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: #FF0033;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(255, 0, 51, 0.8), 0 2px 4px #000;
      -webkit-text-stroke: 1px #400000;
    }

    canvas#radar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.8);
      background: radial-gradient(circle, #081d0d 0%, #020703 100%);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .telemetry-bar {
      margin-top: 8px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #7ab886;
      text-transform: uppercase;
      text-shadow: 0 1px 2px #000;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8), 0 2px 4px #000;
      font-family: "Arial Black", Impact, sans-serif;
    }

    /* Outbreak Alert Banner - Left of Radar */
    #stream-alert-box {
      display: none;
      position: absolute;
      bottom: 24px;
      right: 254px;
      width: 250px;
      background: rgba(180, 0, 20, 0.98);
      border: 3.5px solid #FF0033;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.9), 0 0 20px #000;
      animation: pulse 0.4s infinite alternate;
      z-index: 101;
    }

    .alert-main {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 0 0 12px #000, 0 2px 4px #000;
      letter-spacing: 1.2px;
      font-family: "Arial Black", Impact, sans-serif;
      -webkit-text-stroke: 1px #000;
      margin: 0;
      padding: 0;
    }

    .alert-timer {
      font-size: 26px;
      line-height: 1.1;
      font-weight: 900;
      color: #FFF;
      font-family: "Arial Black", Impact, sans-serif;
      margin: 4px 0;
      text-shadow: 0 0 14px #000, 0 2px 5px #000;
      -webkit-text-stroke: 1.5px #000;
    }

    .alert-sub {
      font-size: 12px;
      line-height: 1.2;
      font-weight: 900;
      color: #FFE600;
      letter-spacing: 0.8px;
      text-shadow: 0 0 8px #000, 0 2px 3px #000;
      -webkit-text-stroke: 0.5px #000;
      margin: 0;
      padding: 0;
    }

    /* 5-Slot Inventory - Bottom Left */
    #minecraft-inventory {
      position: absolute;
      bottom: 20px;
      left: 24px;
      display: flex;
      gap: 6px;
      background: rgba(12, 18, 12, 0.85);
      border: 2.5px solid rgba(0, 255, 102, 0.6);
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 255, 102, 0.35);
      z-index: 100;
    }

    .mc-slot {
      width: 54px;
      height: 54px;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .mc-slot.filled {
      border-color: #00FF66;
      background: rgba(0, 24, 12, 0.9);
      box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.4);
    }

    .mc-slot img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 255, 102, 0.7));
    }

    .mc-slot .slot-label {
      font-size: 8px;
      font-weight: 900;
      color: #00FF66;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: "Arial Black", Impact, sans-serif;
      margin-top: 1px;
      text-shadow: 0 0 4px #000;
    }

    /* Combat Notification Banner */
    #item-combat-log {
      display: none;
      position: absolute;
      bottom: 95px;
      left: 24px;
      background: rgba(0, 0, 0, 0.95);
      border: 2.5px solid #00FF66;
      border-radius: 10px;
      padding: 8px 16px;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      white-space: nowrap;
      z-index: 102;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: translateY(8px) scale(0.92); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Layer (Prefers Apple HEVC .mov for iOS transparency) -->
  <div id="video-layer">
    <video id="zombie-run-vid" muted playsinline>
      <source src="zombie_run.mov" type='video/mp4; codecs="hvc1"'>
      <source src="zombie_run.webm" type="video/webm">
    </video>
    <video id="zombie-bite-vid" muted playsinline>
      <source src="zombie_bite.mov" type='video/mp4; codecs="hvc1"'>
      <source src="zombie_bite.webm" type="video/webm">
    </video>
  </div>

  <!-- Outbreak Alert Banner -->
  <div id="stream-alert-box">
    <div class="alert-main" id="alert-title">⚠ HORDE OUTBREAK ⚠</div>
    <div class="alert-timer" id="alert-timer">00:45</div>
    <div class="alert-sub" id="alert-desc">SPRINT > 15 MPH TO ESCAPE!</div>
  </div>

  <!-- Notification & Combat Toast -->
  <div id="item-combat-log"></div>

  <!-- 5-Slot Inventory (Bottom Left) -->
  <div id="minecraft-inventory">
    <div class="mc-slot" id="slot-0"></div>
    <div class="mc-slot" id="slot-1"></div>
    <div class="mc-slot" id="slot-2"></div>
    <div class="mc-slot" id="slot-3"></div>
    <div class="mc-slot" id="slot-4"></div>
  </div>

  <!-- Radar HUD (Bottom Right) -->
  <div id="hud-container">
    <div class="hud-title">ZOMBIE ESCAPE</div>
    <canvas id="radar"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const HORDE_TRIGGER_COUNT = 10;
    const HORDE_ESCAPE_MPH = 15.0;
    const HORDE_TIME_LIMIT_SEC = 45;
    const SPRINTER_ESCAPE_MPH = 17.0;
    const RESTART_TRIGGER_MPH = 14.0;
    const RADAR_MAX_METERS = 100.0;
    const ESCAPE_SUSTAIN_MS = 1800; // Requires 1.8s sustained sprint to clear false GPS jitter

    let player = { lat: 42.3314, lon: -83.0458, speedMph: 0, headingRad: 0, targetHeading: 0 };
    let zombies = [];
    let isHordeActive = false;
    let isSprinterActive = false;
    let hordeDeadline = null;
    let sprinterDeadline = null;
    let isZombieState = false;
    let isDustingZombies = false;
    let escapeStreakStartTime = null;
    let hasFirstZombieSpawned = false; // Start condition gate

    // --- 5-SLOT INVENTORY SYSTEM ---
    const WEAPON_POOL = [
      { name: 'HONDA',   file: 'honda.jpg', maxKills: 5 },
      { name: 'BAT',     file: 'bat.jpg',   maxKills: 1 },
      { name: 'KNIFE',   file: 'knife.jpg', maxKills: 1 },
      { name: 'SWORD',   file: 'sword.jpg', maxKills: 1 },
      { name: 'SHOTGUN', file: 'shotgun.jpg', maxKills: 1 }
    ];
    let inventory = [];
    let isUsingWeapon = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const alertBox = document.getElementById('stream-alert-box');
    const alertTitle = document.getElementById('alert-title');
    const alertTimer = document.getElementById('alert-timer');
    const alertDesc = document.getElementById('alert-desc');
    const combatToast = document.getElementById('item-combat-log');

    // Video Elements
    const runVideo = document.getElementById('zombie-run-vid');
    const biteVideo = document.getElementById('zombie-bite-vid');
    let isRunPlaying = false;

    // High-DPI Radar Canvas
    const dpr = window.devicePixelRatio || 2;
    const displaySize = 180;
    canvas.width = displaySize * dpr;
    canvas.height = displaySize * dpr;
    ctx.scale(dpr, dpr);

    // --- AUDIO PIPELINE ---
    function createTrack(filename, loop = false) {
      const a = new Audio(filename);
      a.preload = 'auto';
      a.loop = loop;
      return a;
    }

    const sfxDunn = createTrack('dunn.m4a');
    const musicChase = createTrack('chase.m4a', true);
    const voiceEvil = createTrack('evil_voice.m4a');
    const sfxGrowl = createTrack('zombie_growl.m4a');
    const sfxBite = createTrack('zombie_bite.m4a');

    function playSound(track) {
      if (!track) return;
      track.currentTime = 0;
      track.play().catch(() => {});
    }

    // Web Audio Chime & Weapon Break
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playDing() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1174.66, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760.00, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.warn('Ding failed:', e);
      }
    }

    function playItemBreakSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.18);

        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.35, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        noise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);
      } catch (e) {
        console.warn('Break sound failed:', e);
      }
    }

    // --- VIDEO TRIGGER HANDLERS ---
    function triggerZombieApproachVideo() {
      if (isRunPlaying || isZombieState) return;
      isRunPlaying = true;
      runVideo.currentTime = 0;
      runVideo.className = 'zombie-charge-anim';
      runVideo.play().catch(() => {});
      playSound(sfxGrowl);

      runVideo.onended = () => {
        runVideo.className = '';
        runVideo.style.display = 'none';
        isRunPlaying = false;
      };

      setTimeout(() => {
        runVideo.className = '';
        runVideo.style.display = 'none';
        isRunPlaying = false;
      }, 2900);
    }

    // --- JITTER-RESISTANT DUAL-ENGINE GPS ---
    let lastGpsLat = null;
    let lastGpsLon = null;
    let lastGpsTime = null;

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          // Drop noisy fixes immediately (accuracy worse than 14m)
          if (pos.coords.accuracy && pos.coords.accuracy > 14) {
            return;
          }

          const newLat = pos.coords.latitude;
          const newLon = pos.coords.longitude;
          const nowMs = pos.timestamp || Date.now();

          let reportedMph = 0;
          if (pos.coords.speed !== null && !isNaN(pos.coords.speed) && pos.coords.speed >= 0) {
            reportedMph = pos.coords.speed * 2.23694;
          }

          let calculatedMph = 0;
          let timeDeltaSec = 0;
          if (lastGpsLat !== null && lastGpsLon !== null && lastGpsTime !== null) {
            timeDeltaSec = (nowMs - lastGpsTime) / 1000;
            if (timeDeltaSec > 0.25 && timeDeltaSec < 4.0) {
              const distMeters = getDistanceMeters(lastGpsLat, lastGpsLon, newLat, newLon);
              calculatedMph = (distMeters / timeDeltaSec) * 2.23694;
            }

            const dY = newLat - lastGpsLat;
            const dX = (newLon - lastGpsLon) * Math.cos(newLat * Math.PI / 180);
            if (Math.hypot(dY, dX) > 0.00001) {
              player.targetHeading = Math.atan2(dX, dY);
            }
          }

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            player.targetHeading = pos.coords.heading * Math.PI / 180;
          }

          // Filter out physical outliers
          let candidateMph = reportedMph;
          if (calculatedMph > reportedMph && calculatedMph < 30.0) {
            candidateMph = calculatedMph;
          }

          // Acceleration clamp: Skates realistically won't accelerate > 6.5 MPH in a single second
          if (timeDeltaSec > 0 && player.speedMph > 0) {
            const maxPhysJump = Math.max(3.0, timeDeltaSec * 6.5);
            if (candidateMph > player.speedMph + maxPhysJump) {
              candidateMph = player.speedMph + maxPhysJump;
            }
          }

          lastGpsLat = newLat;
          lastGpsLon = newLon;
          lastGpsTime = nowMs;
          player.lat = newLat;
          player.lon = newLon;

          player.speedMph = parseFloat(candidateMph.toFixed(1));
          speedEl.innerText = player.speedMph;
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 4000 }
      );
    }

    // --- INVENTORY UI & LOGIC ---
    function renderInventory() {
      for (let i = 0; i < 5; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        if (inventory[i]) {
          slotEl.className = 'mc-slot filled';
          slotEl.innerHTML = `
            <img src="${inventory[i].file}" alt="${inventory[i].name}" />
            <span class="slot-label">${inventory[i].name}</span>
          `;
        } else {
          slotEl.className = 'mc-slot';
          slotEl.innerHTML = '';
        }
      }
    }

    function showToast(msg, borderColor, textColor) {
      combatToast.innerText = msg;
      combatToast.style.display = 'block';
      combatToast.style.borderColor = borderColor;
      combatToast.style.color = textColor;
      setTimeout(() => {
        combatToast.style.display = 'none';
      }, 4400);
    }

    function addRandomWeapon() {
      if (isZombieState) return;
      if (!hasFirstZombieSpawned) return; // Block drops until first zombie appears on board

      if (inventory.length >= 5) {
        showToast('⚠ INVENTORY FULL!', '#FFE600', '#FFE600');
        return;
      }

      const chosen = WEAPON_POOL[Math.floor(Math.random() * WEAPON_POOL.length)];
      inventory.push(chosen);
      renderInventory();
      playDing();
      showToast(`📦 YOU FOUND A ${chosen.name}!`, '#00E5FF', '#00E5FF');
    }

    // Weapon Drop Loop: 60 - 120s
    function scheduleWeaponDrop() {
      const nextDelaySec = 60 + Math.random() * 60;
      setTimeout(() => {
        addRandomWeapon();
        scheduleWeaponDrop();
      }, nextDelaySec * 1000);
    }
    scheduleWeaponDrop();

    // Starter Drop Check at 10s
    setTimeout(() => { addRandomWeapon(); }, 10000);

    // Item Usage: 10-Second Wait, 20% Hit Rate, Honda 5-kill
    function scheduleItemUse() {
      if (isUsingWeapon || inventory.length === 0 || zombies.length === 0 || isZombieState) return;

      isUsingWeapon = true;
      setTimeout(() => {
        if (inventory.length === 0 || zombies.length === 0 || isZombieState) {
          isUsingWeapon = false;
          return;
        }

        const item = inventory.shift();
        renderInventory();

        const didHit = Math.random() < 0.20;

        if (didHit) {
          zombies.sort((a, b) => a.dist - b.dist);
          const kills = Math.min(item.maxKills, zombies.length);
          zombies.splice(0, kills);
          countEl.innerText = zombies.length;
          playSound(sfxDunn);

          if (item.name === 'HONDA') {
            showToast(`🚗 HONDA MOWED DOWN ${kills} ZOMBIE(S)!`, '#00FF66', '#00FF66');
          } else {
            showToast(`⚔ KILLED ZOMBIE WITH ${item.name}!`, '#00FF66', '#00FF66');
          }
        } else {
          playItemBreakSound();
          showToast(`💥 OH NO THAT ${item.name} BROKE!`, '#FF0033', '#FF4444');
        }

        isUsingWeapon = false;

        if (inventory.length > 0 && zombies.length > 0) {
          scheduleItemUse();
        }
      }, 10000);
    }

    // --- ZOMBIE SPAWNER ---
    function spawnZombie(forceSprinter = false) {
      if (isZombieState) return;

      hasFirstZombieSpawned = true; // Unlocks weapon drops from now on

      const canSprinter = !isHordeActive && !isSprinterActive;
      const isSprinter = canSprinter && (forceSprinter || (Math.random() < 0.03));
      const isAmbush = isSprinter ? false : (Math.random() < 0.20);
      
      const baseRelAngle = isAmbush 
        ? (Math.random() - 0.5) * 0.8
        : Math.PI + (Math.random() - 0.5) * 1.4;

      const personalHoldDist = isSprinter ? (20 + Math.random() * 8) : (26 + Math.random() * 16);

      zombies.push({
        id: Date.now() + Math.random(),
        dist: 92 + Math.random() * 6,
        targetHoldDist: personalHoldDist,
        relAngle: baseRelAngle,
        mode: isAmbush ? 'ambush' : 'chase',
        type: isSprinter ? 'sprinter' : 'normal',
        wiggleSeed: Math.random() * 100,
        wiggleFreq: 4.5 + Math.random() * 2.5
      });

      countEl.innerText = zombies.length;
      playSound(sfxDunn);

      triggerZombieApproachVideo();
      scheduleItemUse();

      if (isSprinter && !isSprinterActive) {
        triggerSprinter();
      }
    }

    function triggerHordeSpawn() {
      const isPack = Math.random() < 0.10;
      const count = isPack ? 3 : 1;
      for (let i = 0; i < count; i++) {
        spawnZombie();
      }
    }

    // Zombie Spawner Loop: 25 - 70s
    function scheduleSpawn() {
      const nextSpawnSec = 25 + Math.random() * 45;
      setTimeout(() => {
        triggerHordeSpawn();
        scheduleSpawn();
      }, nextSpawnSec * 1000);
    }
    scheduleSpawn();

    function triggerSprinter() {
      isSprinterActive = true;
      sprinterDeadline = Date.now() + (20 * 1000);
      escapeStreakStartTime = null;

      musicChase.currentTime = 0;
      musicChase.play().catch(() => {});

      alertBox.style.display = "block";
      alertBox.style.background = "rgba(0, 40, 180, 0.98)";
      alertBox.style.borderColor = "#00D9FF";
      alertBox.style.boxShadow = "0 0 35px rgba(0, 217, 255, 0.9), 0 0 15px #000";
      alertTitle.innerText = "⚡ BLUE SPRINTER DETECTED ⚡";
      alertDesc.innerText = "SPRINT > 17 MPH TO ESCAPE!";
      alertDesc.style.color = "#00E5FF";
    }

    // --- GAME ENGINE LOOP ---
    let lastTime = performance.now();
    let scanAngle = 0;

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      let diff = player.targetHeading - player.headingRad;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      player.headingRad += diff * 0.05;

      zombies.forEach((z) => {
        if (isDustingZombies) {
          z.dist += (40 + Math.random() * 25) * dt;
          return;
        }

        if (z.mode === 'ambush') {
          z.dist -= (22 * dt);
          if (z.dist <= 16) {
            z.mode = 'chase';
            z.relAngle = Math.PI + (Math.random() - 0.5) * 0.8;
          }
          return;
        }

        if (isSprinterActive) {
          const progress = Math.max(0, (sprinterDeadline - Date.now()) / (20 * 1000));
          const targetDist = z.type === 'sprinter' ? (progress * 18) : (progress * z.targetHoldDist);
          z.dist += (targetDist - z.dist) * 0.06;
        } else if (isHordeActive) {
          const progress = Math.max(0, (hordeDeadline - Date.now()) / (HORDE_TIME_LIMIT_SEC * 1000));
          const targetDist = progress * z.targetHoldDist;
          z.dist += (targetDist - z.dist) * 0.05;
        } else {
          if (z.dist > z.targetHoldDist + 1) {
            z.dist -= (10 * dt);
          } else {
            z.dist += (z.targetHoldDist - z.dist) * 0.03;
          }
        }
      });

      handleGameState();
      renderRadar(now / 1000);
      requestAnimationFrame(gameLoop);
    }

    function handleGameState() {
      if (isZombieState) {
        if (player.speedMph >= RESTART_TRIGGER_MPH) {
          resetBoard();
        }
        return;
      }

      // Sprinter Check with Sustained Sprint Filter
      if (isSprinterActive) {
        const remainingMs = sprinterDeadline - Date.now();
        const remSec = Math.max(0, Math.ceil(remainingMs / 1000));
        alertTimer.innerText = "00:" + (remSec < 10 ? "0" : "") + remSec;

        if (player.speedMph >= SPRINTER_ESCAPE_MPH && !isDustingZombies) {
          if (!escapeStreakStartTime) escapeStreakStartTime = Date.now();
          if (Date.now() - escapeStreakStartTime >= ESCAPE_SUSTAIN_MS) {
            escapeStreakStartTime = null;
            triggerEscapeSequence("⚡ SPRINTER EVADED ⚡", "BOARD CLEARED!");
          }
          return;
        } else {
          escapeStreakStartTime = null;
        }

        if (remSec <= 0 && !isDustingZombies) {
          triggerInfectionFail();
        }
        return;
      }

      // Horde Trigger
      if (zombies.length >= HORDE_TRIGGER_COUNT && !isHordeActive && !isDustingZombies) {
        isHordeActive = true;
        hordeDeadline = Date.now() + (HORDE_TIME_LIMIT_SEC * 1000);
        escapeStreakStartTime = null;

        alertBox.style.display = "block";
        alertBox.style.background = "rgba(180, 0, 20, 0.98)";
        alertBox.style.borderColor = "#FF0033";
        alertBox.style.boxShadow = "0 0 35px rgba(255, 0, 51, 0.9), 0 0 20px #000";
        alertTitle.innerText = "⚠ HORDE OUTBREAK ⚠";
        alertDesc.innerText = "SPRINT > 15 MPH TO ESCAPE!";
        alertDesc.style.color = "#FFE600";

        musicChase.currentTime = 0;
        musicChase.play().catch(() => {});
      }

      // Horde Escape Check with Sustained Sprint Filter
      if (isHordeActive) {
        const remainingMs = hordeDeadline - Date.now();
        const totalSec = Math.max(0, Math.ceil(remainingMs / 1000));
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        alertTimer.innerText = (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;

        if (player.speedMph >= HORDE_ESCAPE_MPH && !isDustingZombies) {
          if (!escapeStreakStartTime) escapeStreakStartTime = Date.now();
          if (Date.now() - escapeStreakStartTime >= ESCAPE_SUSTAIN_MS) {
            escapeStreakStartTime = null;
            triggerEscapeSequence("✓ ESCAPED", "LEFT IN THE DUST!");
          }
          return;
        } else {
          escapeStreakStartTime = null;
        }

        if (totalSec <= 0 && !isDustingZombies) {
          triggerInfectionFail();
        }
      }
    }

    function triggerEscapeSequence(titleText, descText) {
      isDustingZombies = true;
      musicChase.pause();
      musicChase.currentTime = 0;

      alertTitle.innerText = titleText;
      alertDesc.innerText = descText;
      alertTimer.innerText = "CLEARED";

      setTimeout(() => {
        resetBoard();
      }, 1800);
    }

    function triggerInfectionFail() {
      isZombieState = true;
      isHordeActive = false;
      isSprinterActive = false;
      isDustingZombies = false;
      isUsingWeapon = false;
      escapeStreakStartTime = null;

      inventory = [];
      renderInventory();

      musicChase.pause();
      musicChase.currentTime = 0;

      // Stop running video
      runVideo.className = '';
      runVideo.style.display = 'none';
      isRunPlaying = false;

      // Pop Bite Video
      biteVideo.style.display = 'block';
      biteVideo.currentTime = 0;
      biteVideo.play().catch(e => console.warn('Bite video error:', e));
      playSound(sfxBite);

      biteVideo.onended = () => {
        biteVideo.style.display = 'none';
        playSound(voiceEvil);
      };

      setTimeout(() => {
        if (biteVideo.style.display === 'block') {
          biteVideo.style.display = 'none';
          playSound(voiceEvil);
        }
      }, 2800);

      alertBox.style.display = "block";
      alertBox.style.background = "rgba(70, 0, 0, 0.98)";
      alertBox.style.borderColor = "#FF0000";
      alertTitle.innerText = "☠ YOU ARE A ZOMBIE NOW ☠";
      alertTimer.innerText = "INFECTED";
      alertDesc.innerText = "SPRINT > 14 MPH TO RESTART";
      alertDesc.style.color = "#FF3333";
    }

    function resetBoard() {
      zombies = [];
      countEl.innerText = "0";
      isHordeActive = false;
      isSprinterActive = false;
      isZombieState = false;
      isDustingZombies = false;
      isUsingWeapon = false;
      hasFirstZombieSpawned = false; // Reset start condition gate
      hordeDeadline = null;
      sprinterDeadline = null;
      escapeStreakStartTime = null;
      alertBox.style.display = "none";
      musicChase.pause();
      musicChase.currentTime = 0;

      biteVideo.style.display = 'none';
      runVideo.className = '';
      runVideo.style.display = 'none';
      isRunPlaying = false;

      inventory = [];
      renderInventory();
    }

    // High-DPI Radar Render
    function renderRadar(timeSec) {
      ctx.clearRect(0, 0, displaySize, displaySize);
      const cx = displaySize / 2;
      const cy = displaySize / 2;

      ctx.strokeStyle = "rgba(0, 255, 102, 0.45)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / RADAR_MAX_METERS) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.strokeStyle = "rgba(0, 255, 102, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, 8);
      ctx.lineTo(cx, 16);
      ctx.stroke();

      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      ctx.fillStyle = isZombieState ? "#FF0033" : "#00E5FF";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      zombies.forEach(z => {
        if (z.dist <= RADAR_MAX_METERS) {
          const wiggleAngleOffset = Math.sin((timeSec * z.wiggleFreq) + z.wiggleSeed) * 0.07;
          const currentRelAngle = z.relAngle + wiggleAngleOffset;

          const distJitter = Math.cos((timeSec * z.wiggleFreq * 1.5) + z.wiggleSeed) * 0.75;
          const currentDist = Math.max(2, z.dist + distJitter);

          const drawDist = (currentDist / RADAR_MAX_METERS) * (cx - 10);
          const x = cx + drawDist * Math.sin(currentRelAngle);
          const y = cy - drawDist * Math.cos(currentRelAngle);

          ctx.beginPath();
          if (z.type === 'sprinter') {
            ctx.fillStyle = "#00F0FF";
            ctx.shadowColor = "#00F0FF";
            ctx.shadowBlur = 16;
            ctx.arc(x, y, 7.5, 0, Math.PI * 2);
          } else {
            ctx.fillStyle = "#FF0033";
            ctx.shadowColor = "#FF0033";
            ctx.shadowBlur = 12;
            ctx.arc(x, y, 6, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }

    renderInventory();
    requestAnimationFrame(gameLoop);
  </script>
</body>
