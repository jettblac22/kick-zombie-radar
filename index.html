<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zombie Survival Radar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Black", sans-serif;
      user-select: none;
    }

    #hud-container {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 240px;
      background: #0d120d;
      border: 3px solid #00FF66;
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 255, 102, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 12px 10px;
      cursor: pointer;
      z-index: 100;
    }

    .hud-title {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #FF0033;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.7), 0 0 20px rgba(0, 0, 0, 0.9);
    }

    canvas {
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 102, 0.7);
      background: radial-gradient(circle, #09210e 0%, #030804 100%);
    }

    .telemetry-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .telemetry-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #72a87c;
      text-transform: uppercase;
    }

    .telemetry-val {
      font-size: 20px;
      font-weight: 900;
      color: #00FF66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
      font-family: "Arial Black", Impact, sans-serif;
    }

    #stream-alert-box {
      display: none;
      position: absolute;
      bottom: 330px;
      left: 24px;
      width: 320px;
      background: rgba(180, 0, 20, 0.95);
      border: 3px solid #FF0033;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.8), 0 0 15px #000;
      animation: pulse 0.4s infinite alternate;
      z-index: 101;
    }

    .alert-main {
      font-size: 22px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 0 0 10px #000;
      letter-spacing: 1.5px;
      font-family: "Arial Black", Impact, sans-serif;
    }

    .alert-sub {
      font-size: 15px;
      font-weight: 800;
      color: #FFE600;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div id="stream-alert-box">
    <div class="alert-main" id="alert-title">⚠ HORDE OUTBREAK ⚠</div>
    <div class="alert-sub" id="alert-desc">SPRINT > 14 MPH TO ESCAPE!</div>
  </div>

  <div id="hud-container" title="Tap to test">
    <div class="hud-title">ZOMBIE ESCAPE</div>
    <canvas id="radar" width="200" height="200"></canvas>
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">SPEED</span>
        <span class="telemetry-val"><span id="speed-val">0.0</span> <span style="font-size: 13px;">MPH</span></span>
      </div>
      <div class="telemetry-item">
        <span class="telemetry-label">HORDE</span>
        <span class="telemetry-val" id="zombie-count">0</span>
      </div>
    </div>
  </div>

  <script>
    const ESCAPE_SPEED_MPH = 14.0;
    const SPRINTER_ESCAPE_MPH = 17.0;
    const HORDE_TRIGGER_COUNT = 10;
    const RADAR_MAX_METERS = 100.0;

    let player = { lat: 42.3314, lon: -83.0458, speedMph: 0, headingRad: 0 };
    let zombies = [];
    let isHordeChaseActive = false;
    let isSprinterChaseActive = false;
    let threatStartTime = null;
    let isOverrun = false;

    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed-val');
    const countEl = document.getElementById('zombie-count');
    const alertBox = document.getElementById('stream-alert-box');
    const alertTitle = document.getElementById('alert-title');
    const alertDesc = document.getElementById('alert-desc');

    // --- AUDIO SYSTEM ---
    function createTrack(filename, loop = false) {
      const a = new Audio(filename);
      a.preload = 'auto';
      a.loop = loop;
      a.playsInline = true;
      return a;
    }

    const sfxDunn = createTrack('dunn.m4a');
    const musicChase = createTrack('chase.m4a', true);
    const musicSprinter = createTrack('sprinter.m4a', true);
    const voiceEvil = createTrack('evil_voice.m4a');

    let audioUnlocked = false;
    function unlockAudioChannels() {
      if (audioUnlocked) return;
      [sfxDunn, musicChase, musicSprinter, voiceEvil].forEach(track => {
        const p = track.play();
        if (p !== undefined) {
          p.then(() => {
            track.pause();
            track.currentTime = 0;
          }).catch(() => {});
        }
      });
      audioUnlocked = true;
    }

    function playSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(e => console.warn('Audio blocked:', e));
    }

    // --- HARDWARE GPS & HEADING ---
    let lastGpsLat = null;
    let lastGpsLon = null;

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const newLat = pos.coords.latitude;
          const newLon = pos.coords.longitude;

          if (lastGpsLat !== null && lastGpsLon !== null) {
            const dY = newLat - lastGpsLat;
            const dX = (newLon - lastGpsLon) * Math.cos(newLat * Math.PI / 180);
            if (Math.hypot(dY, dX) > 0.00001) {
              player.headingRad = Math.atan2(dX, dY);
            }
          }
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            player.headingRad = pos.coords.heading * Math.PI / 180;
          }

          lastGpsLat = newLat;
          lastGpsLon = newLon;
          player.lat = newLat;
          player.lon = newLon;

          const rawSpeed = pos.coords.speed || 0;
          player.speedMph = parseFloat((rawSpeed * 2.23694).toFixed(1));
          speedEl.innerText = player.speedMph;
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // --- SPAWNING SYSTEM (Standard & Blue Sprinter) ---
    function spawnZombieEntity(forceSprinter = false) {
      const isSprinter = forceSprinter || (Math.random() < 0.03); // 3% Sprinter chance
      const isAmbush = isSprinter ? false : (Math.random() < 0.20);
      
      let relAngle;
      let initSpeed;

      if (isSprinter) {
        relAngle = Math.PI + (Math.random() - 0.5) * 0.5; // Stalks directly behind
        initSpeed = 0.22; // Much faster approach
      } else if (isAmbush) {
        relAngle = (Math.random() - 0.5) * (Math.PI / 2);
        initSpeed = 0.28;
      } else {
        relAngle = Math.PI + (Math.random() - 0.5) * (Math.PI * 0.7);
        initSpeed = 0.08;
      }

      const spawnDist = 80 + Math.random() * 15;
      const globalAngle = player.headingRad + relAngle;

      zombies.push({
        id: Date.now() + Math.random(),
        dist: spawnDist,
        angle: globalAngle,
        mode: isAmbush ? 'charge' : 'chase',
        speed: initSpeed,
        type: isSprinter ? 'sprinter' : 'normal'
      });

      countEl.innerText = zombies.length;
      playSound(sfxDunn);

      if (isSprinter && !isSprinterChaseActive) {
        triggerSprinterAlert();
      }
    }

    function triggerZombieSpawnEvent() {
      const isPack = Math.random() < 0.10;
      const count = isPack ? 3 : 1;
      for (let i = 0; i < count; i++) {
        spawnZombieEntity();
      }
    }

    // Spawn loop: 15 to 50 seconds
    function scheduleNextSpawn() {
      const nextDelayMs = (15 + Math.random() * 35) * 1000;
      setTimeout(() => {
        triggerZombieSpawnEvent();
        scheduleNextSpawn();
      }, nextDelayMs);
    }
    scheduleNextSpawn();

    function triggerSprinterAlert() {
      isSprinterChaseActive = true;
      threatStartTime = Date.now();
      isOverrun = false;

      // Stop regular chase music if playing
      musicChase.pause();
      musicChase.currentTime = 0;

      // Start blue sprinter theme
      musicSprinter.currentTime = 0;
      musicSprinter.play().catch(() => {});

      alertBox.style.display = "block";
      alertBox.style.background = "rgba(0, 40, 180, 0.95)";
      alertBox.style.borderColor = "#00D9FF";
      alertBox.style.boxShadow = "0 0 30px rgba(0, 217, 255, 0.8), 0 0 15px #000";
      alertTitle.innerText = "⚡ BLUE SPRINTER DETECTED ⚡";
      alertDesc.innerText = "SPRINT > 17 MPH IN 20 SECONDS!";
      alertDesc.style.color = "#00E5FF";
    }

    // Desk test controls:
    // Single tap = normal spawn
    // Double tap = simulate 17.5 MPH burst
    // Triple tap = force spawn Blue Sprinter
    let tapCount = 0;
    let tapTimer = null;
    document.getElementById('hud-container').addEventListener('click', () => {
      unlockAudioChannels();
      tapCount++;

      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => {
        if (tapCount === 1) {
          triggerZombieSpawnEvent();
        } else if (tapCount === 2) {
          player.speedMph = 17.5;
          speedEl.innerText = "17.5";
          setTimeout(() => {
            player.speedMph = 0.0;
            speedEl.innerText = "0.0";
          }, 1800);
        } else if (tapCount >= 3) {
          spawnZombieEntity(true);
        }
        tapCount = 0;
      }, 350);
    });

    // --- GAME ENGINE & ESCAPE LOGIC ---
    let lastTime = performance.now();
    let scanAngle = 0;

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      // Physics & Tracking
      zombies.forEach((z) => {
        const targetAngle = player.headingRad + Math.PI;

        if (z.mode === 'charge') {
          z.dist -= (z.speed * 60) * dt;
          if (z.dist < 18) {
            z.mode = 'chase';
            z.speed = 0.09;
            z.angle = targetAngle + (Math.random() - 0.5) * 0.5;
            z.dist = 22;
          }
        } else {
          z.dist -= (z.speed * 35) * dt;
          if (z.dist < 8) z.dist = 8;

          let angleDiff = targetAngle - z.angle;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          z.angle += angleDiff * (z.type === 'sprinter' ? 0.05 : 0.02);
        }
      });

      // Threat State Handlers
      if (isSprinterChaseActive) {
        handleSprinterSurvival();
      } else if (zombies.length >= HORDE_TRIGGER_COUNT) {
        handleHordeSurvival();
      }

      renderRadar();
      requestAnimationFrame(gameLoop);
    }

    function handleSprinterSurvival() {
      const elapsedSec = (Date.now() - threatStartTime) / 1000;

      // Overrun if 20 seconds pass without hitting 17 MPH
      if (elapsedSec >= 20 && !isOverrun) {
        isOverrun = true;
        alertTitle.innerText = "💀 TIME EXPIRED 💀";
        alertDesc.innerText = "HIT 14 MPH TO ACCEPT FATE";
        alertDesc.style.color = "#FF0033";
      }

      // Success: Beat sprinter with 17 MPH within 20s
      if (!isOverrun && player.speedMph >= SPRINTER_ESCAPE_MPH) {
        musicSprinter.pause();
        musicSprinter.currentTime = 0;
        alertTitle.innerText = "⚡ SPRINTER OUTRUN ⚡";
        alertDesc.innerText = "BOARD CLEARED!";
        setTimeout(() => resetGameState(), 3000);
      }

      // Failure: Overrun, hits >= 14 MPH -> Evil voice triggers
      if (isOverrun && player.speedMph >= ESCAPE_SPEED_MPH) {
        musicSprinter.pause();
        musicSprinter.currentTime = 0;
        playSound(voiceEvil);
        alertTitle.innerText = "☠ TOO LATE ☠";
        alertDesc.innerText = "YOU ARE A ZOMBIE NOW!";
        setTimeout(() => resetGameState(), 6000);
      }
    }

    function handleHordeSurvival() {
      if (!isHordeChaseActive) {
        isHordeChaseActive = true;
        threatStartTime = Date.now();
        isOverrun = false;

        alertBox.style.display = "block";
        alertBox.style.background = "rgba(180, 0, 20, 0.95)";
        alertBox.style.borderColor = "#FF0033";
        alertBox.style.boxShadow = "0 0 30px rgba(255, 0, 51, 0.8), 0 0 15px #000";
        alertTitle.innerText = "⚠ HORDE OUTBREAK ⚠";
        alertDesc.innerText = "SPRINT > 14 MPH TO ESCAPE!";
        alertDesc.style.color = "#FFE600";

        musicChase.currentTime = 0;
        musicChase.play().catch(() => {});
      }

      const elapsedSec = (Date.now() - threatStartTime) / 1000;
      if (elapsedSec >= 20 && !isOverrun) {
        isOverrun = true;
        alertTitle.innerText = "💀 INFECTION CRITICAL 💀";
        alertDesc.innerText = "YOU WERE OVERRUN!";
      }

      if (player.speedMph >= ESCAPE_SPEED_MPH) {
        musicChase.pause();
        musicChase.currentTime = 0;

        if (isOverrun) {
          playSound(voiceEvil);
          alertTitle.innerText = "☠ TOO LATE ☠";
          alertDesc.innerText = "YOU ARE A ZOMBIE NOW!";
          setTimeout(() => resetGameState(), 6000);
        } else {
          alertTitle.innerText = "✓ ESCAPED";
          alertDesc.innerText = "HORDE EVADED!";
          setTimeout(() => resetGameState(), 3000);
        }
      }
    }

    function resetGameState() {
      zombies = [];
      countEl.innerText = "0";
      isHordeChaseActive = false;
      isSprinterChaseActive = false;
      isOverrun = false;
      threatStartTime = null;
      alertBox.style.display = "none";
      musicChase.pause();
      musicChase.currentTime = 0;
      musicSprinter.pause();
      musicSprinter.currentTime = 0;
    }

    // --- RADAR DRAWING ---
    function renderRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.strokeStyle = "rgba(0, 255, 102, 0.4)";
      ctx.lineWidth = 1.5;
      [30, 60, 90].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, (r / RADAR_MAX_METERS) * (cx - 8), 0, Math.PI * 2);
        ctx.stroke();
      });

      // Direction indicator
      ctx.strokeStyle = "rgba(0, 255, 102, 0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, 8);
      ctx.lineTo(cx, 16);
      ctx.stroke();

      // Sweep line
      scanAngle += 0.045;
      ctx.strokeStyle = "#00FF66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(scanAngle) * (cx - 8), cy + Math.sin(scanAngle) * (cy - 8));
      ctx.stroke();

      // Center Player Indicator
      ctx.fillStyle = "#00E5FF";
      ctx.shadowColor = "#00E5FF";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Zombie Blips
      zombies.forEach(z => {
        if (z.dist <= RADAR_MAX_METERS) {
          const relAngle = z.angle - player.headingRad;
          const drawDist = (z.dist / RADAR_MAX_METERS) * (cx - 12);
          const x = cx + drawDist * Math.sin(relAngle);
          const y = cy - drawDist * Math.cos(relAngle);

          ctx.beginPath();
          if (z.type === 'sprinter') {
            // Neon Cyan Blue for Sprinter
            ctx.fillStyle = "#00F0FF";
            ctx.shadowColor = "#00F0FF";
            ctx.shadowBlur = 14;
            ctx.arc(x, y, 7.5, 0, Math.PI * 2);
          } else {
            // Red for standard zombies
            ctx.fillStyle = "#FF0033";
            ctx.shadowColor = "#FF0033";
            ctx.shadowBlur = 10;
            ctx.arc(x, y, 6, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
